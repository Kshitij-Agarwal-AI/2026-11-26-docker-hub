## Builds the image for Intel/AMD and ARM, publishes it on Docker Hub,
## and commits its sha- tag to docker-compose.yml.
## Save this file as .github/workflows/publish-dockerhub.yml

name: Publish image to Docker Hub

## When the workflow runs
on:
  ## by hand: Actions tab > Publish image to Docker Hub > Run workflow
  workflow_dispatch:

  ## on its own: when a push changes one of these files
  push:
    ## only branch pushes, not tags: a release creates a tag, and GitHub
    ## ignores the paths filter for tag pushes, so it would run every release
    branches:
      - '**'
    ## building takes a while, so run only when the environment changes
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .python-version
      - renv.lock
      - .Rprofile
      - renv/activate.R
      - .github/workflows/publish-dockerhub.yml

env:
  ## Your image: your Docker Hub username / this GitHub repository's name.
  ## To give it a different name on Docker Hub, replace the part after the /.
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
  ## Docker image names must be lowercase, so each job first saves IMAGE_NAME_LOWER.
  ## Naming rules: https://docs.docker.com/docker-hub/repos/create/

jobs:
  ## Job 1: build the image on two computers at the same time,
  ## one Intel/AMD and one ARM, and push one tag from each
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest     ## Intel/AMD
            arch: amd64
          - runner: ubuntu-24.04-arm  ## ARM
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 1. Make the image name lowercase (see env at the top)
        run: echo "IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: 2. Check out the repository
        uses: actions/checkout@v7

      ## TODO: rename DOCKER_PASSWORD to DOCKERHUB_TOKEN (it holds a token):
      ## https://github.com/UBC-DSCI/reproducible-and-trustworthy-workflows-for-data-science/issues/68
      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ## tag: sha- + first 7 characters of the commit + chip, e.g. sha-1a2b3c4-arm64
      - name: 4. Build the image
        run: docker build --tag "$IMAGE_NAME_LOWER:sha-${GITHUB_SHA::7}-${{ matrix.arch }}" .

      - name: 5. Push the image
        run: docker push "$IMAGE_NAME_LOWER:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"

  ## Job 2: after both builds finish, tag the two images together,
  ## so each computer pulls the one for its chip
  combine:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Make the image name lowercase (see env at the top)
        run: echo "IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      ## TODO: same as step 3 above (issue #68)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ## latest is handy, but it's the last build from any branch, not just main.
      ## careful: if you don't explicitly re-tag latest, it stays on an old image.
      - name: Combine the two images
        run: |
          ## builds nothing (no QEMU): points the latest and sha- tags at the two images
          docker buildx imagetools create \
            --tag "$IMAGE_NAME_LOWER:latest" \
            --tag "$IMAGE_NAME_LOWER:sha-${GITHUB_SHA::7}" \
            "$IMAGE_NAME_LOWER:sha-${GITHUB_SHA::7}-amd64" \
            "$IMAGE_NAME_LOWER:sha-${GITHUB_SHA::7}-arm64"

  ## Job 3: write the new tag into docker-compose.yml and commit it
  ## to the branch you pushed, so your team only has to git pull
  update-compose:
    needs: combine
    runs-on: ubuntu-latest
    ## lets this job push a commit to your repository
    permissions:
      contents: write

    steps:
      - name: Make the image name lowercase (see env at the top)
        run: echo "IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Check out the repository
        uses: actions/checkout@v7

      ## finds the image: line with your Docker Hub name (commented out or not)
      ## and swaps its tag; the local image: line is left alone
      - name: Put the new tag in docker-compose.yml
        ## skip if there's no docker-compose.yml
        if: hashFiles('docker-compose.yml') != ''
        run: |
          sed -i "s|\(image: $IMAGE_NAME_LOWER:\).*|\1sha-${GITHUB_SHA::7}|" docker-compose.yml

      ## $GITHUB_REF_NAME is the branch you pushed, e.g. main or your PR's branch
      - name: Commit and push docker-compose.yml
        ## skip if there's no docker-compose.yml
        if: hashFiles('docker-compose.yml') != ''
        run: |
          ## commit as GitHub's bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          ## no change (e.g. a re-run): stop here
          git diff --cached --quiet && exit 0
          git commit -m "Use image tag sha-${GITHUB_SHA::7} in docker-compose.yml"
          ## get commits pushed while the image was building
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
